services:
  - name: kneset
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    # Free-инстанс засыпает после 15 минут без трафика и просыпается за ~минуту
    # на первом запросе. Для платного тарифа поменять на starter и заодно вернуть
    # Sync__IntervalHours к 6 (см. ниже).
    plan: free
    # Blazor Server держит состояние страницы в цепи SignalR на конкретном инстансе,
    # а балансировщик Render раскидывает запросы равномерно и не умеет закреплять
    # сессию за инстансом. Поэтому масштабировать вширь нельзя — только один инстанс.
    numInstances: 1
    healthCheckPath: /
    envVars:
      # Строка подключения к Supabase задаётся в дашборде Render, в репозиторий не попадает.
      - key: ConnectionStrings__Default
        sync: false
      # Спящий инстанс не тикает таймером, поэтому периодический цикл бессмысленен:
      # 0 — синхронизироваться один раз при каждом пробуждении. На платном тарифе — 6.
      - key: Sync__IntervalHours
        value: "0"
